<section class="terminal-panel">
    <div class="panel-header">MAIN_CONSOLE // ROOT ACCESS</div>

    <div class="terminal-logs" id="terminal-logs">
        <div class="log-entry log-system">[SYSTEM] 보안 터미널 연결 완료.</div>
        <div class="log-entry log-system">[SYSTEM] 목표 코드를 제한 시간 안에 입력하여 서버 데이터를 추출하십시오.</div>
    </div>

    <div class="puzzle-box">
        <div class="puzzle-meta">
            <span>TARGET DECRYPTION CODE</span>
            <span id="target-target-name">SERVER: NEXUS-CORE</span>
        </div>

        <div class="target-code-display" id="target-code-display">----</div>

        <div class="timer-bar-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>

        <form class="input-form" id="hack-form">
            <input
                type="text"
                id="hack-input"
                autocomplete="off"
                placeholder="CODE 입력 후 ENTER..."
                autofocus
            >
            <button type="submit">BREACH</button>
        </form>
    </div>
</section>
